<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <meta
      name="description"
      content="Show, hide, drag-reorder, pin left or right, and resize columns by drag or keyboard — then persist the layout to the URL or storage."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AdaptTable demo — column management</title>
    <script>
      // Apply the stored theme before paint so page-to-page navigation
      // doesn't flash light.
      try {
        if (localStorage.getItem("adapttable-demo-theme") === "dark")
          document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-columns.tsx"></script>
  </body>
</html>
