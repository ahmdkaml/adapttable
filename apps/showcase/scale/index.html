<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <meta
      name="description"
      content="Scroll fifty thousand rows under a pinned sticky header — AdaptTable's opt-in virtualization keeps the DOM to a handful of nodes."
    />
    <!-- Cloudflare Web Analytics — cookieless, no consent banner needed. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "dd71ff9f3b7b4064969d3f81e8c6ee9b"}'
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AdaptTable demo — 50,000 rows, virtualized</title>
    <script>
      // Apply the stored theme before paint so page-to-page navigation
      // doesn't flash light.
      try {
        if (localStorage.getItem("adapttable-demo-theme") === "dark")
          document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-scale.tsx"></script>
  </body>
</html>
