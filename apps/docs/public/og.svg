<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AdaptTable — the headless React data table for any UI kit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0f"/>
      <stop offset="1" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="64" y="120" width="6" height="390" rx="3" fill="url(#accent)"/>
  <g transform="translate(100 124) scale(2.3)">
    <rect x="8.5" y="1.5" width="22" height="22" rx="5.5" fill="#3d3568"/>
    <rect x="5" y="5" width="22" height="22" rx="5.5" fill="#564a9e"/>
    <rect x="1.5" y="8.5" width="22" height="22" rx="5.5" fill="#6c5ce7"/>
    <rect x="4.5" y="12.5" width="16" height="2.8" rx="1.2" fill="#ffffff"/>
    <rect x="11.1" y="12.5" width="2.8" height="14.5" rx="1.2" fill="#ffffff"/>
    <rect x="4.5" y="18.8" width="4.6" height="2.2" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="4.5" y="23" width="4.6" height="2.2" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="15.9" y="18.8" width="4.6" height="2.2" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="15.9" y="23" width="4.6" height="2.2" rx="1" fill="#ffffff" opacity="0.4"/>
  </g>
  <text x="196" y="190" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="74" font-weight="800" fill="#ffffff" letter-spacing="-2">Adapt<tspan fill="#8b7cf6">Table</tspan></text>
  <text x="100" y="270" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="600" fill="#e4e4e7">The headless React data table for any UI kit</text>
  <text x="100" y="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="27" fill="#a1a1aa">URL-synced state · client + server data · virtualization · i18n / RTL</text>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600">
    <rect x="100" y="404" width="132" height="54" rx="27" fill="#16121f" stroke="#3a3550"/>
    <text x="166" y="439" fill="#e4e4e7" text-anchor="middle">Mantine</text>
    <rect x="246" y="404" width="84" height="54" rx="27" fill="#16121f" stroke="#3a3550"/>
    <text x="288" y="439" fill="#e4e4e7" text-anchor="middle">MUI</text>
    <rect x="344" y="404" width="120" height="54" rx="27" fill="#16121f" stroke="#3a3550"/>
    <text x="404" y="439" fill="#e4e4e7" text-anchor="middle">Chakra</text>
    <rect x="478" y="404" width="168" height="54" rx="27" fill="#16121f" stroke="#3a3550"/>
    <text x="562" y="439" fill="#e4e4e7" text-anchor="middle">Ant Design</text>
    <rect x="660" y="404" width="108" height="54" rx="27" fill="#16121f" stroke="#3a3550"/>
    <text x="714" y="439" fill="#e4e4e7" text-anchor="middle">Radix</text>
    <rect x="782" y="404" width="156" height="54" rx="27" fill="#16121f" stroke="#3a3550"/>
    <text x="860" y="439" fill="#e4e4e7" text-anchor="middle">shadcn/ui</text>
    <rect x="952" y="404" width="144" height="54" rx="27" fill="#16121f" stroke="#3a3550"/>
    <text x="1024" y="439" fill="#e4e4e7" text-anchor="middle">Tailwind</text>
  </g>
  <text x="100" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#8b7cf6">npx @adapttable/cli init</text>
  <text x="1100" y="560" font-family="system-ui, sans-serif" font-size="22" fill="#71717a" text-anchor="end">MIT · TypeScript · React 18+</text>
