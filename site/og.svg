<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AdaptTable — the headless React data table for any UI kit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0f"/>
      <stop offset="1" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="64" y="120" width="6" height="390" rx="3" fill="url(#accent)"/>
  <text x="100" y="190" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="74" font-weight="800" fill="#ffffff" letter-spacing="-2">Adapt<tspan fill="#8b7cf6">Table</tspan></text>
  <text x="100" y="270" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="600" fill="#e4e4e7">The headless React data table for any UI kit</text>
  <text x="100" y="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" fill="#a1a1aa">Client + server data · URL state · infinite scroll · i18n / RTL · dark mode</text>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="600">
    <rect x="100" y="404" width="180" height="58" rx="29" fill="#16121f" stroke="#3a3550"/>
    <text x="190" y="441" fill="#e4e4e7" text-anchor="middle">Mantine</text>
    <rect x="296" y="404" width="120" height="58" rx="29" fill="#16121f" stroke="#3a3550"/>
    <text x="356" y="441" fill="#e4e4e7" text-anchor="middle">MUI</text>
    <rect x="432" y="404" width="150" height="58" rx="29" fill="#16121f" stroke="#3a3550"/>
    <text x="507" y="441" fill="#e4e4e7" text-anchor="middle">Chakra</text>
    <rect x="598" y="404" width="190" height="58" rx="29" fill="#16121f" stroke="#3a3550"/>
    <text x="693" y="441" fill="#e4e4e7" text-anchor="middle">Ant Design</text>
    <rect x="804" y="404" width="170" height="58" rx="29" fill="#16121f" stroke="#3a3550"/>
    <text x="889" y="441" fill="#e4e4e7" text-anchor="middle">Tailwind</text>
  </g>
  <text x="100" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#8b7cf6">npx @adapttable/cli init</text>
  <text x="1100" y="560" font-family="system-ui, sans-serif" font-size="22" fill="#71717a" text-anchor="end">MIT · TypeScript · React 18+</text>
</svg>
