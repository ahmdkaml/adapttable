name: ✨ Feature request
description: Suggest an idea or improvement for AdaptTable
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API or behaviour look like? Sketch a snippet if you can.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Where should this live?
      options:
        - Core engine (all adapters benefit)
        - A specific adapter
        - i18n
        - CLI
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for a similar request.
          required: true
