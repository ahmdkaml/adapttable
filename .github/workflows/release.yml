name: Release

on:
  push:
    branches: [main]
  # Manual recovery when GitHub drops a push event.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Skip cleanly until an NPM_TOKEN secret is configured, so pushes don't fail
  # before the project is set up to publish. Add the secret (Settings →
  # Secrets → Actions → NPM_TOKEN) and this activates automatically.
  guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    if: ${{ needs.guard.outputs.enabled == 'true' }}
    name: Version or Publish
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # The publish path re-verifies the exact release commit before
          # anything reaches npm: full gate (lint, types, coverage, build,
          # publint, dist smoke) plus peer floors. There is no route to
          # `changeset publish` around a failed gate. Version-PR creation
          # (the other path of this action) stays fast — CI runs the same
          # gate on that PR anyway.
          publish: pnpm verify:release && pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The version-bump commit must not run the husky gate on this
          # 2-core runner: CI enforces the same gate on every PR (including
          # the Version Packages PR), and the full suite inside a commit
          # hook starves past the 30s antd test budget.
          HUSKY: "0"
