name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual recovery when GitHub drops a push event.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo Remote Cache (optional): with the secrets set, local green
  # gates pre-warm CI. Absent secrets are a silent no-op.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # One cheap job decides what the parallel jobs below actually do:
  #   full         — the diff touches package code, so the package gate must run
  #   dedupe       — a main push whose tree an earlier PR run already verified
  #   run-packages — full && !dedupe. Gates work that ANY code change can
  #     break: lint, lint:root, typecheck.
  #   packages-changed — packages/, the lockfile or the harness script. Gates
  #     work only a PACKAGE change can break: unit tests, the packed build,
  #     publint, the dist smoke test and the React matrix. `apps/` imports
  #     from `packages/` and never the reverse, so an app-only diff cannot
  #     affect them — running them there tests nothing and costs four runners.
  #   need-build   — run-packages || packages-changed. One compile; lint,
  #     tests, publint, floors, the consumer harness and the React matrix
  #     replay `^build` from that cache instead of compiling the graph again.
  # Every decision fails open: any error → full gate.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.diff.outputs.full }}
      dedupe: ${{ steps.dedupe.outputs.dedupe }}
      run-packages: ${{ steps.combine.outputs.run }}
      packages-changed: ${{ steps.combine.outputs.packages }}
      need-build: ${{ steps.combine.outputs.need-build }}
    steps:
      # Full history: the three-dot diff below needs a merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Docs-only / workflow-only diffs skip the package gate but ALWAYS
      # report (required checks must never sit "expected"). The doc guards
      # and format check still run in light mode — docs edits can break
      # check:readmes / check:docsurface. Fail-open: no diff → full gate.
      - name: Detect relevant changes
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "$BASE_REF"
          if ! diff_files="$(git diff --name-only "origin/$BASE_REF"...HEAD)"; then
            echo "Could not compute the diff — running the full gate."
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The root README is a TEST INPUT: packages/cli/src/kits-docs.test.ts
          # reads it and asserts every scaffoldable kit appears in the table.
          # That guard lives in test:coverage, so a README-only diff must run
          # the full gate — allowlisting it would skip the check that exists to
          # catch exactly that drift.
          if printf '%s\n' "$diff_files" | grep -qxE 'README\.md'; then
            echo "Root README changed — it is a test input, running the full gate."
            echo "full=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$diff_files" \
            | grep -qvE '^(docs/|.*\.md$|llms.*\.txt$|.*/robots\.txt$|\.github/|\.changeset/|ai_docs/)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "Docs/workflow-only diff — running format + doc guards only."
          fi
          # Narrower than `full`: only diffs that can change what a consumer
          # installs make the packed-tarball harness worth its minutes.
          if printf '%s\n' "$diff_files" \
            | grep -qE '^(packages/|pnpm-lock\.yaml$|scripts/consumer-harness\.mjs$)'; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

      # A push to main whose TREE matches a commit already verified by a
      # successful PR run is the same code under a new SHA (squash merge of
      # an up-to-date branch). Re-running the suite proves nothing — report
      # green instantly. Any drift in the tree (branch behind main, manual
      # push) misses the match and the full gate runs. workflow_dispatch
      # always runs for real: it exists to recover from dropped events.
      - name: Dedupe against PR-verified trees
        id: dedupe
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "dedupe=false" >> "$GITHUB_OUTPUT"
          tree="$(git rev-parse 'HEAD^{tree}')"
          shas="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&event=pull_request&per_page=30" \
            --jq '.workflow_runs[].head_sha' 2>/dev/null)" || exit 0
          for sha in $shas; do
            t="$(gh api "repos/${{ github.repository }}/git/commits/$sha" --jq '.tree.sha' 2>/dev/null)" || continue
            if [ "$t" = "$tree" ]; then
              echo "Tree $tree already verified by PR run at $sha — reporting green without re-running."
              # Overwrite: last write wins in GITHUB_OUTPUT.
              echo "dedupe=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No verified tree match — full gate."

      - name: Combine
        id: combine
        run: |
          if [ "${{ steps.diff.outputs.full }}" = "true" ] && [ "${{ steps.dedupe.outputs.dedupe }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            run=true
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            run=false
          fi
          # PR events measured the packages diff directly; push/dispatch have
          # no base to diff against, so the harness follows the package gate.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            packages="${{ steps.diff.outputs.packages }}"
          else
            packages="$run"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ "$run" = "true" ] || [ "$packages" = "true" ]; then
            echo "need-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "need-build=false" >> "$GITHUB_OUTPUT"
          fi

  # The only cold compile. Lint, typecheck, tests, publint, floors, the
  # consumer harness and the React matrix all `needs:` this job and replay
  # `^build` from the SHA-keyed turbo cache. Always reports so dependents
  # are never skipped into "expected" on a required check.
  build:
    name: Build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.dedupe != 'true' && needs.changes.outputs.need-build == 'true'

      - uses: ./.github/actions/setup-pnpm
        if: needs.changes.outputs.dedupe != 'true' && needs.changes.outputs.need-build == 'true'

      - name: Build packages
        if: needs.changes.outputs.dedupe != 'true' && needs.changes.outputs.need-build == 'true'
        run: pnpm build

  # Format and the source-only guards — no dist needed, so this runs
  # alongside Build instead of behind it.
  quality-docs:
    name: Format · doc guards
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.dedupe != 'true'

      - uses: ./.github/actions/setup-pnpm
        if: needs.changes.outputs.dedupe != 'true'
        with:
          turbo-cache: "false"

      - name: Format check
        if: needs.changes.outputs.dedupe != 'true'
        run: pnpm format:check

      - name: Check adapter READMEs advertise every feature
        if: needs.changes.outputs.dedupe != 'true'
        run: pnpm check:readmes

      - name: Check every export is documented
        if: needs.changes.outputs.dedupe != 'true'
        run: pnpm check:docsurface

      # Reads packages/*/src only, so it follows the code steps rather than
      # the doc guards: a docs-only diff cannot change which parts a kit names.
      - name: Check every structural part is named in every kit
        if: needs.changes.outputs.run-packages == 'true'
        run: pnpm check:parts

      - name: Lint root tooling
        if: needs.changes.outputs.run-packages == 'true'
        run: pnpm lint:root

      # Root tooling has its own suite under `node --test`: the showcase page
      # manifest against the pages on disk, and the sitemap route arithmetic
      # both the docs build and the composed-site check run on.
      - name: Test root tooling
        if: needs.changes.outputs.run-packages == 'true'
        run: pnpm test:scripts

  # Type-aware eslint and tsc need the built .d.ts files (`lint` / `typecheck`
  # both `dependsOn: ["^build"]`). They wait for Build and replay, they do
  # not compile the graph again.
  quality-code:
    name: Lint · types
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.run-packages == 'true'

      - uses: ./.github/actions/setup-pnpm
        if: needs.changes.outputs.run-packages == 'true'

      - name: Lint
        if: needs.changes.outputs.run-packages == 'true'
        # One package at a time: the 2-core runner starves parallel eslint
        # the same way it starves vitest (see Tests below). Without this
        # the job hangs until the 6h GitHub cap.
        run: pnpm lint --concurrency=1

      - name: Typecheck
        if: needs.changes.outputs.run-packages == 'true'
        run: pnpm typecheck

  # Exact required-check name. Do not rename. Format runs in parallel with
  # Build; lint waits for it; this wrap-up still reports under the name the
  # ruleset requires, including on docs-only diffs.
  quality:
    name: Quality (format · doc guards · lint · types)
    needs: [changes, quality-docs, quality-code]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require format, docs, lint and types
        run: |
          changes="${{ needs.changes.result }}"
          docs="${{ needs.quality-docs.result }}"
          code="${{ needs.quality-code.result }}"
          if [ "$changes" != "success" ]; then
            echo "Changes job: $changes"
            exit 1
          fi
          if [ "$docs" != "success" ]; then
            echo "Format · doc guards: $docs"
            exit 1
          fi
          if [ "$code" != "success" ]; then
            echo "Lint · types: $code"
            exit 1
          fi

  # The slowest lane gets its own runner instead of queueing behind lint.
  # `test:coverage` still `dependsOn: ["^build"]` — that is a cache replay.
  tests:
    name: Tests (coverage)
    needs: [changes, build]
    if: needs.changes.outputs.packages-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Test with coverage
        # One package's suite at a time: the 2-core runner can't host several
        # vitest processes at once — antd's cssinjs-heavy tests get starved
        # past the 30s per-test budget (same contention class as the local
        # fileParallelism remedy, applied at the turbo level for CI).
        run: pnpm test:coverage --concurrency=1

  # Exact required-check name. Do not rename without updating the ruleset
  # in the same sitting.
  package:
    name: Package (build · api · publint · smoke · budget)
    needs: [changes, build]
    if: needs.changes.outputs.packages-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # Replay, not a second compile: turbo restores dist from the SHA cache
      # so api:check / publint / smoke / budget see files on disk.
      - name: Restore built packages
        run: pnpm build

      # The committed etc/*.api.md reports are the reviewable form of the
      # public surface — one per entry point every library package advertises,
      # core's seven subpaths included. This byte-compares a fresh extraction
      # against all of them, so an export that changes shape has to arrive with
      # the report that shows it.
      - name: Check the extracted API reports are current
        run: pnpm api:check

      - name: Validate published package configs
        run: pnpm publint

      - name: Smoke-check built package artifacts
        run: pnpm smoke:dist

      # Features are opt-in, so a simple table must stay small. This bundles
      # consumer fixtures against the freshly built packages and fails if one
      # crosses its written ceiling.
      - name: Bundle-size budget
        run: pnpm budget

  # Each adapter promises a kit FLOOR (Mantine 7.2, MUI 6, …). This job runs
  # the packed-tarball floor probe — render, sort, filter popover, row
  # selection, column menu, on React 18 — but ONLY for adapters the PR
  # actually touches; the full matrix guards every publish in verify:release.
  floors:
    name: Peer floors (changed adapters)
    needs: [changes, build]
    if: github.event_name == 'pull_request' && needs.changes.outputs.packages-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Detection needs only git, so it runs BEFORE the toolchain. Setting up
      # Node with `cache: pnpm` registers a post-job cache-save that cannot be
      # skipped — with no `pnpm install` there is no store to save and the job
      # fails on "Path Validation Error". Any PR that touches the lockfile
      # without touching an adapter would hit that, so the toolchain is set up
      # only when there is something to probe.
      - name: Detect changed adapters with kit floors
        id: kits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          floored="mantine mui chakra antd radix base-ui"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD \
            | grep -oE '^packages/adapter-[a-z-]+/' | sort -u \
            | sed -e 's|packages/adapter-||' -e 's|/$||')" || true
          kits=""
          for kit in $changed; do
            case " $floored " in *" $kit "*) kits="$kits $kit" ;; esac
          done
          kits="${kits# }"
          echo "kits=$kits" >> "$GITHUB_OUTPUT"
          if [ -n "$kits" ]; then
            echo "Floors to run: $kits"
          else
            echo "No floored adapter changed — nothing to probe."
          fi

      - uses: ./.github/actions/setup-pnpm
        if: steps.kits.outputs.kits != ''

      - name: Restore the changed adapters
        if: steps.kits.outputs.kits != ''
        run: |
          for kit in ${{ steps.kits.outputs.kits }}; do
            pnpm turbo run build --filter="@adapttable/$kit..."
          done

      - name: Run the floor probes
        if: steps.kits.outputs.kits != ''
        run: |
          for kit in ${{ steps.kits.outputs.kits }}; do
            pnpm peer:floors "$kit"
          done

  # Consumers install tarballs, not workspace source — this job packs every
  # package and proves ESM/CJS entry, three TypeScript resolution modes, pnpm
  # + npm installs, shipped CSS, a Vite production build and a Next.js App
  # Router prerender, all from the tarballs alone.
  consumer:
    name: Packed-consumer harness
    needs: [changes, build]
    if: needs.changes.outputs.packages-changed == 'true' && needs.changes.outputs.run-packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Restore built packages
        run: pnpm build

      - name: Run the packed-consumer harness
        run: pnpm consumer:harness

  # Every package promises `react: ^18 || ^19`, but the workspace develops on
  # one React version — this job proves the packed build actually runs (render,
  # sort, page, search, server-tier fetch) on each supported release line.
  # No job-level `if` here, deliberately: a skipped MATRIX job reports one
  # check under the unexpanded name `React ${{ matrix.react }} compatibility`,
  # so the three expanded names required by the ruleset would wait forever.
  # The job always runs and skips its STEPS instead — each leg reports
  # success under its real name in seconds when there is nothing to verify.
  react-matrix:
    name: React ${{ matrix.react }} compatibility
    needs: [changes, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18.3.1", "19.0.0", "19.2.7"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.packages-changed == 'true'

      - uses: ./.github/actions/setup-pnpm
        if: needs.changes.outputs.packages-changed == 'true'

      - name: Restore the probed packages
        if: needs.changes.outputs.packages-changed == 'true'
        run: pnpm turbo run build --filter=@adapttable/unstyled...

      - name: Smoke-test against React ${{ matrix.react }}
        if: needs.changes.outputs.packages-changed == 'true'
        run: pnpm react:matrix ${{ matrix.react }}
