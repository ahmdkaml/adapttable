name: Bench

# The performance smoke subset. Catches the regression that matters most and is
# easiest to miss in review: windowing stops bounding the DOM, so a table that
# rendered a viewport starts rendering a dataset.
#
# Not a required check — it measures a real browser on a shared runner, so its
# timings are noisy by nature. Its assertions are deliberately shape-based (DOM
# rows stay bounded), never wall-clock, so a slow runner cannot fail it.
#
# It still self-skips through an in-job diff check rather than a workflow-level
# path filter, so it always reports: if this is ever promoted to required, a
# docs-only pull request must not be left permanently "expected".
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Performance smoke
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      # Full history: the three-dot diff below needs a merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail-open: if the diff cannot be computed, run the benchmark.
      - name: Detect relevant changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "$BASE_REF"
          if ! diff_files="$(git diff --name-only "origin/$BASE_REF"...HEAD)"; then
            echo "Could not compute the diff — running the benchmark."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$diff_files" \
            | grep -qE '^(packages/|apps/showcase/|scripts/bench\.mjs$|pnpm-lock\.yaml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No library/showcase changes — nothing for the benchmark to measure."
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.changes.outputs.run == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser
        id: pw-cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.changes.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The dev server resolves `@adapttable/*` to package source, so the
      # benchmark measures the library in this diff rather than a stale build.
      - name: Start the showcase
        if: steps.changes.outputs.run == 'true'
        run: |
          pnpm --filter @adapttable/showcase exec vite --port 4321 --strictPort &
          npx --yes wait-on http://localhost:4321 --timeout 120000

      - name: Run the performance smoke subset
        if: steps.changes.outputs.run == 'true'
        run: node scripts/bench.mjs --port 4321 --smoke
