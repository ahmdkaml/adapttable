name: E2E

# Real-browser smoke suite over the showcase. Guards the bug class jsdom can't
# see (overlay z-index / bleed-through, drawer backdrops, sticky/pinned offsets,
# virtualization DOM bounds).
#
# "Playwright smoke (showcase)" is a REQUIRED status check on main, so this
# workflow must run — and report — on EVERY pull request: a path filter here
# leaves the required check permanently "expected" on PRs that don't touch
# the library (config-only, docs-only), making them unmergeable. The heavy
# work is five shards; that required name is the wrap-up job, same pattern
# as Salma's "Checks" gate over unit-test shards. Never rename it here.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Include the SHA so a hung run (Playwright ignoring SIGINT) cannot
  # queue the next push behind GitHub's 6-hour job default.
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  detect:
    name: E2E detect
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      # Full history: the three-dot diff below needs a merge base, which a
      # shallow clone lacks (that failure once skipped the suite on a branch
      # that rewrote the packages).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Manual runs (workflow_dispatch) always exercise the full suite.
      # Fail-open: if the diff cannot be computed, run the suite — a required
      # check must never skip blind.
      - name: Detect relevant changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "$BASE_REF"
          if ! diff_files="$(git diff --name-only "origin/$BASE_REF"...HEAD)"; then
            echo "Could not compute the diff — running the full suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$diff_files" \
            | grep -qE '^(packages/|apps/showcase/|e2e/|playwright\.config\.ts$|pnpm-lock\.yaml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No library/showcase/e2e changes — smoke suite not needed for this diff."
          fi

  e2e:
    name: E2E shard ${{ matrix.shard }}/5
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the downloaded browser binary across runs, keyed on the lockfile
      # (which pins @playwright/test, so a version bump busts the cache).
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Five free ubuntu-latest machines × 1 Chromium (playwright.config.ts).
      # Playwright splits the suite; `pnpm test:e2e -- --shard=…` does not
      # reach Playwright — each job then runs the full 1207. `pnpm exec`
      # forwards the flag (same as the docs).
      - name: Run E2E smoke suite
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/5

      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Exact required-check name. Do not rename. Docs-only PRs skip the shards
  # and this job still reports green, so the ruleset is never left "expected".
  e2e-gate:
    name: Playwright smoke (showcase)
    needs: [detect, e2e]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require shards when the suite ran
        run: |
          detect="${{ needs.detect.result }}"
          run="${{ needs.detect.outputs.run }}"
          shards="${{ needs.e2e.result }}"
          if [ "$detect" != "success" ]; then
            echo "Detect job: $detect"
            exit 1
          fi
          if [ "$run" != "true" ]; then
            echo "No library/showcase/e2e changes — smoke suite not needed."
            exit 0
          fi
          if [ "$shards" != "success" ]; then
            echo "Playwright shards: $shards"
            exit 1
          fi
